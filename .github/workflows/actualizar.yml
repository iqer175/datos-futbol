name: Actualizar datos de futbol

on:
  schedule:
    # football-data.co.uk actualiza domingo y miercoles por la noche.
    # Corremos lunes y jueves a las 06:00 UTC, ya con los datos frescos.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:        # boton para lanzarlo a mano cuando quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar y procesar
        run: python actualizar_datos.py --temporadas 6

      # ---------- NUEVO ----------
      - name: Generar agregados ligeros
        run: python generar_agregados.py
      # ---------------------------

      - name: Comprobar cobertura de ligas
        run: |
          python - <<'PY'
          import pandas as pd, sys
          d = pd.read_csv('datos/partidos.csv', low_memory=False)
          n = d.groupby('liga').size().sort_values(ascending=False)
          print(n.to_string())
          faltan = {'Premier League','Championship','LaLiga','LaLiga Hypermotion',
                    'Serie A','Serie B','Bundesliga','2. Bundesliga','Ligue 1','Ligue 2',
                    'Eredivisie','Liga Portugal','Brasileirao','Primera Division'} - set(n.index)
          if faltan:
              print('FALTAN LIGAS:', sorted(faltan)); sys.exit(1)
          PY

      - name: Comprobar que los ficheros no salieron vacios
        run: |
          test -s datos/partidos.csv || { echo "partidos.csv vacio"; exit 1; }
          test -s datos/ratings.csv  || { echo "ratings.csv vacio";  exit 1; }
          filas=$(($(wc -l < datos/partidos.csv) - 1))
          echo "Filas en partidos.csv: $filas"
          if [ "$filas" -lt 20000 ]; then
            echo "Muy pocas filas, algo fue mal en la descarga"; exit 1
          fi

      # ---------- NUEVO ----------
      - name: Comprobar que ningun agregado pasa de 45 KB
        run: |
          test -s datos/indice.json || { echo "indice.json vacio"; exit 1; }
          grandes=$(find datos/agregados datos/h2h datos/cierres -name '*.csv' -size +45k)
          if [ -n "$grandes" ]; then
            echo "Estos archivos pasan de 45 KB y habria que partirlos:"
            echo "$grandes"
            exit 1
          fi
          echo "Agregados generados:"
          find datos/agregados datos/h2h datos/cierres -name '*.csv' -exec ls -lh {} \; | awk '{print $9, $5}'
      # ---------------------------

      - name: Publicar cambios
        run: |
          git config user.name  "actualizador-futbol"
          git config user.email "actions@github.com"
          git add datos/
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
